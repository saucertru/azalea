<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #e6edf3; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { background: #111821; border-radius: 10px; box-shadow: 0 0 0 2px #1f2a37; max-width: 95vw; max-height: 75vh; }
  .hud { display: flex; gap: 24px; font-size: 18px; }
  .hint { opacity: .6; font-size: 14px; }
</style>
</head>
<body>
<div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<canvas id="c" width="480" height="480"></canvas>
<div class="hint">Arrow keys / WASD / swipe · Space to pause · R to restart</div>
<script>
(() => {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const N = 24, S = c.width / N;
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  let best = 0;
  try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
  bestEl.textContent = best;
  let snake, dir, nextDir, food, score, paused, dead, timer;

  function reset() {
    snake = [{ x: 10, y: 12 }, { x: 9, y: 12 }, { x: 8, y: 12 }];
    dir = { x: 1, y: 0 }; nextDir = dir; score = 0; paused = false; dead = false;
    scoreEl.textContent = 0; placeFood();
    clearInterval(timer); timer = setInterval(tick, 110);
  }
  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(p => p.x === food.x && p.y === food.y));
  }
  function tick() {
    if (paused || dead) return;
    dir = nextDir;
    const head = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
    if (snake.some(p => p.x === head.x && p.y === head.y)) { dead = true; draw(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++; scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snake-best', best); } catch (e) {} }
      placeFood();
    } else snake.pop();
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#ff5c7a';
    ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2.4, 0, Math.PI * 2); ctx.fill();
    snake.forEach((p, i) => {
      ctx.fillStyle = i === 0 ? '#7ee787' : '#3fb950';
      ctx.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2);
    });
    if (dead || paused) {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 32px system-ui';
      ctx.fillText(dead ? 'Game over' : 'Paused', c.width / 2, c.height / 2);
      ctx.font = '16px system-ui';
      ctx.fillText(dead ? 'Press R or tap to restart' : 'Press Space to resume', c.width / 2, c.height / 2 + 30);
    }
  }
  function turn(x, y) { if (x !== -dir.x || y !== -dir.y) nextDir = { x, y }; }
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'w'].includes(k)) turn(0, -1);
    else if (['arrowdown', 's'].includes(k)) turn(0, 1);
    else if (['arrowleft', 'a'].includes(k)) turn(-1, 0);
    else if (['arrowright', 'd'].includes(k)) turn(1, 0);
    else if (k === ' ') { paused = !paused; draw(); }
    else if (k === 'r') reset();
    else return;
    e.preventDefault();
  });
  let tx = 0, ty = 0;
  c.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  c.addEventListener('touchend', e => {
    if (dead) { reset(); return; }
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
  });
  c.addEventListener('click', () => { if (dead) reset(); });
  reset(); draw();
})();
</script>
</body>
</html>
