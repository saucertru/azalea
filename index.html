<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azelela</title>
<meta name="description" content="Games, music, videos, books, chat and more.">
<link rel="icon" href="assets/icon.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script>
  // apply saved theme colours before anything paints (avoids a flash)
  try {
    var s = JSON.parse(localStorage.getItem('azelela.settings') || '{}');
    if (s.theme && ['arctic', 'paper'].indexOf(s.theme) >= 0) document.documentElement.style.background = s.theme === 'arctic' ? '#eef3f8' : '#f5efe3';
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <div id="boot"><div class="spinner"></div></div>
</div>
<noscript><p style="padding:24px">This site needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
