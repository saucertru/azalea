<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #game ruffle-player, #game ruffle-object { width: 100%; height: 100%; display: block; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; line-height: 1.5; }
  .msg b { color: #fff; }
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var type = q.get('type');
  var src = q.get('src') || '';
  var core = q.get('core') || '';
  var title = q.get('title') || 'Game';
  document.title = title;
  var box = document.getElementById('game');

  function fail(text) {
    box.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'msg';
    d.innerHTML = '<div><b>Could not start the game.</b><br></div>';
    d.firstChild.appendChild(document.createTextNode(text));
    document.body.appendChild(d);
  }

  // only allow files from this site's games folder
  if (!/^games\//.test(src) || /\.\.|:|\\/.test(src)) {
    fail('Invalid game path.');
    return;
  }

  function load(url, onload) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = onload || null;
    s.onerror = function () { fail('A required script could not load (' + url.split('/')[2] + '). It may be blocked on this network.'); };
    document.head.appendChild(s);
  }

  if (type === 'flash') {
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = { autoplay: 'on', unmuteOverlay: 'hidden', letterbox: 'on', backgroundColor: '#000000', contextMenu: 'rightClickOnly', splashScreen: true };
    load('https://unpkg.com/@ruffle-rs/ruffle', function () {
      try {
        var ruffle = window.RufflePlayer.newest();
        var p = ruffle.createPlayer();
        box.appendChild(p);
        p.load(src).catch(function (e) { fail(String(e && e.message || e)); });
      } catch (e) { fail(String(e && e.message || e)); }
    });
  } else if (type === 'rom') {
    if (!core) { fail('Unknown system.'); return; }
    window.EJS_player = '#game';
    window.EJS_core = core;
    window.EJS_gameUrl = src;
    window.EJS_gameName = title;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_color = '#7c8cff';
    if (core === 'psp' || core === '3ds') window.EJS_threads = true;
    load('https://cdn.emulatorjs.org/stable/data/loader.js');
  } else {
    fail('Unknown game type.');
  }
})();
</script>
</body>
</html>
